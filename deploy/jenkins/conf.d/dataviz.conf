# ============================================================
# 统一入口配置 (Docker Nginx, 由系统 nginx 迁移)
# 变更点:
#   1. proxy_pass 127.0.0.1:8080 → dataviz-server:8080 (容器名)
#   2. 静态 root /opt/dataviz/web → /usr/share/nginx/dataviz-web (卷挂载)
#   3. 新增 /snapcal/ → snapcal-server:8081 (iOS App 新入口)
# ============================================================

server {
    listen       80;
    server_name  myblog.wiki;

    # dataviz 前端静态资源
    root   /usr/share/nginx/dataviz-web;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # SPA 路由回退 (history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jenkins UI + GitHub webhook (http://myblog.wiki/jenkins/...)
    location ^~ /jenkins {   # ^~: 优先于下方 js/css 正则, 防静态规则截胡
        proxy_pass http://snapcal-jenkins:8080;   # 原样转发, 保持 /jenkins 前缀
        # HTTP 源下浏览器会忽略这些安全头并刷控制台警告, 直接剥掉 (上 HTTPS 后可移除)
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # dataviz API 反向代理
    location /api/ {
        proxy_pass http://dataviz-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # dataviz WebSocket 代理
    location /api/ws/ {
        proxy_pass http://dataviz-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SnapCal App API 入口: /snapcal/xxx → snapcal-server:8081/api/xxx
    # (后端 context-path 为 /api; 8081 直连仍保留兜底)
    location ^~ /snapcal/ {  # ^~: 同上
        proxy_pass http://snapcal-server:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;   # 餐盘照片上传 (后端 multipart 上限 12MB)
    }

    # 静态资源缓存 (带 hash 的 js/css 长缓存)
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 上传大小限制 (大屏缩略图等)
    client_max_body_size 20m;
}
