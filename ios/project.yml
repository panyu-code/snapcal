name: SnapCal
options:
  bundleIdPrefix: com.yupan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 9FSXKC3754

schemes:
  SnapCal:
    build:
      targets:
        SnapCal: all
    test:
      targets:
        - SnapCalUITests

targets:
  SnapCal:
    type: application
    platform: iOS
    sources:
      - SnapCal
    info:
      path: SnapCal/Info.plist
      properties:
        CFBundleDisplayName: SnapCal
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: SnapCal 需要使用相机拍摄餐盘照片以识别食物热量
        NSPhotoLibraryUsageDescription: SnapCal 需要访问相册以导入餐盘照片
        NSHealthShareUsageDescription: SnapCal 会将记录的膳食营养数据写入 Apple 健康
        NSHealthUpdateUsageDescription: SnapCal 会读取步数和活动消耗用于热量统计
        # 开发期允许 HTTP (后端 8081), 上架换 HTTPS 后删除
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      properties:
        CFBundleDisplayName: SnapCal
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: SnapCal 需要使用相机拍摄餐盘照片以识别食物热量
        # 开发期允许 HTTP (后端 8081 未上 HTTPS), 上架前删掉换 HTTPS
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: SnapCal 需要访问相册以导入餐盘照片
        # 开发期后端为 HTTP, 允许该域名 (上架前换 HTTPS 后删除)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yupan.snapcal
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

  SnapCalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SnapCalUITests
    dependencies:
      - target: SnapCal
    info:
      path: SnapCalUITests/Info.plist
      properties:
        CFBundleDisplayName: SnapCalUITests
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
