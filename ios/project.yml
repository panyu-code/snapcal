name: SnapCal
options:
  bundleIdPrefix: com.yupan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SnapCal:
    type: application
    platform: iOS
    sources:
      - SnapCal
    scheme: {}
    info:
      path: SnapCal/Info.plist
      properties:
        CFBundleDisplayName: SnapCal
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: SnapCal 需要使用相机拍摄餐盘照片以识别食物热量
        NSPhotoLibraryUsageDescription: SnapCal 需要访问相册以导入餐盘照片
        # 开发期后端为 HTTP, 允许该域名 (上架前换 HTTPS 后删除)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yupan.snapcal
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
