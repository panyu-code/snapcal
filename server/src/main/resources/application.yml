server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: snapcal-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/snapcal?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:YuPan95270.}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
    banner: false

snapcal:
  jwt:
    # HS256 密钥 (生产环境务必通过环境变量覆盖)
    secret: ${JWT_SECRET:snapcal-dev-secret-95270-please-change-in-prod}
    expire-days: 30
  apple:
    # App 的 Bundle ID (与 Apple Developer 后台一致)
    audience: ${APPLE_BUNDLE_ID:com.yupan.snapcal}
  # 开发模式: 允许 /auth/dev-login (上架前关闭)
  dev-mode: ${DEV_MODE:true}
  auth:
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-expire-minutes: ${AUTH_CODE_EXPIRE_MINUTES:10}
  # 对象存储 (复用 dataviz 的 RustFS 实例)
  oss:
    endpoint: ${OSS_ENDPOINT:http://dataviz-rustfs:9000}
    external-endpoint: ${OSS_EXTERNAL_ENDPOINT:http://myblog.wiki:9000}
    access-key: ${OSS_ACCESS_KEY:dataviz}
    secret-key: ${OSS_SECRET_KEY:YuPan95270.}
    bucket: ${OSS_BUCKET:snapcal}
    region: us-east-1
  # 视觉识别 AI (mock 无key可跑通链路; glm/qwen/siliconflow 接真实识别)
  vision:
    provider: ${VISION_PROVIDER:mock}
    api-key: ${VISION_API_KEY:}
    model: ${VISION_MODEL:glm-4v-flash}
    api-url: ${VISION_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}

logging:
  level:
    com.snapcal: info
