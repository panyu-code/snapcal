server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: snapcal-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/snapcal?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:YuPan95270.}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
    banner: false

snapcal:
  jwt:
    # HS256 密钥 (生产环境务必通过环境变量覆盖)
    secret: ${JWT_SECRET:snapcal-dev-secret-95270-please-change-in-prod}
    expire-days: 30
  apple:
    # App 的 Bundle ID (与 Apple Developer 后台一致)
    audience: ${APPLE_BUNDLE_ID:com.yupan.snapcal}
  # 开发模式: 允许 /auth/dev-login (上架前关闭)
  dev-mode: ${DEV_MODE:true}

logging:
  level:
    com.snapcal: info
